name: Flow State CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Giới hạn quyền GITHUB_TOKEN theo nguyên tắc least-privilege.
permissions:
  contents: read

# Hủy các run cũ khi có push/PR mới trên cùng branch, tránh lãng phí phút CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        # actions/checkout v5 natively targets Node.js 24

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        # pnpm/action-setup v4.4.0 natively targets Node.js 24
        # pnpm/action-setup tự đọc version từ trường "packageManager" trong package.json

      - name: Setup Node.js 22.x
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        # actions/setup-node v5 natively targets Node.js 24
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Dependencies (cảnh báo, không chặn build)
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: TypeScript Type Check
        run: pnpm exec tsc --noEmit

      - name: ESLint Check
        run: pnpm lint

      - name: Unit Tests (Vitest)
        run: pnpm test

      - name: Verify Production Next.js Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}
        run: pnpm run build

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        # gitleaks-action v3 natively targets Node.js 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}