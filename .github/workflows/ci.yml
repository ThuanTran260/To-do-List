name: Flow State CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Giới hạn quyền GITHUB_TOKEN theo nguyên tắc least-privilege.
permissions:
  contents: read

# Hủy các run cũ khi có push/PR mới trên cùng branch, tránh lãng phí phút CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # pnpm/action-setup tự đọc version từ trường "packageManager" trong package.json

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Dependencies (cảnh báo, không chặn build)
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: TypeScript Type Check
        run: pnpm exec tsc --noEmit

      - name: ESLint Check
        run: pnpm lint

      - name: Unit Tests (Vitest)
        run: pnpm test

      - name: Verify Production Next.js Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}
        run: pnpm run build