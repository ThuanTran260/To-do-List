name: Flow State CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Giới hạn quyền GITHUB_TOKEN theo nguyên tắc least-privilege.
# Chỉ cần đọc code, không cần ghi vào repo/PR/issue nào cả.
permissions:
  contents: read

# Hủy các run cũ khi có push/PR mới trên cùng branch, tránh lãng phí
# phút CI và tránh race-condition giữa các run song song.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # tránh job treo vô thời hạn

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Audit Dependencies (cảnh báo, không chặn build)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Verify Production Next.js Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}
        run: npm run build